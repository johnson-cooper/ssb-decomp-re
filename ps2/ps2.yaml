# Super Smash Bros. 64 - native PlayStation 2 port.
#
#   ./ps2/tools/prepare_assets.sh /path/to/baserom.us.z64   (once; builds SSB64.DAT)
#   cd ps2 && ps2build build
#
# Output: ps2/build/bin/ssb64.elf  (copy SSB64.DAT next to it)
#
# Targets:
#   ssb_platform  PS2 platform layer: boot/IOP, libultra replacement, GS
#                 renderer + GBI translator, input, storage, saves, audio.
#   ssb64         the bootable ELF.

project: ssb64

targets:
  # Real-device IOP modules that are not guaranteed to exist in the
  # ps2build package set are built from the vendored, pinned sources below.
  - name: ata_bd
    type: iop
    sources: [iop/ata_bd/src/ps2atad.c]
    include_dirs: [iop/ata_bd/src]
    headers: &iop_headers [common, startup, stdio, ioman, iomanx, intrman, excepman, loadcore, sysmem, sysclib, threadman, timrman, dmacman, heaplib, sifcmd, sifman, modload, cdvd, dev9, smap, netman, bdm, usbd, sio2man, padman, mcman, secrman, sior, atad, libsd, spu2, vblank, poweroff, filexio]
    defines: [ATA_USE_DEV9=1, ATA_GAMESTAR_WORKAROUND=1, ATA_ENABLE_BDM=1]
    imports_lst: iop/ata_bd/src/imports.lst
    exports_tab: iop/ata_bd/src/exports.tab

  - name: smap_udpbd
    type: iop
    sources: [iop/smap_udpbd/src/main.c, iop/smap_udpbd/src/smap.c, iop/smap_udpbd/src/xfer.c, iop/smap_udpbd/src/ministack.c, iop/smap_udpbd/src/udpbd.c, iop/smap_udpbd/src/udptty.c]
    include_dirs: [iop/smap_udpbd/src, iop/smap_udpbd/src/include]
    headers: *iop_headers
    cflags: [-mno-check-zero-division]
    imports_lst: iop/smap_udpbd/src/imports.lst
    exports_tab: iop/smap_udpbd/src/exports.tab

  - name: udpfs_smap
    type: iop
    sources: [iop/udpfs_smap/src/main.c, iop/udpfs_smap/src/smap.c, iop/udpfs_smap/src/xfer.c]
    include_dirs: [iop/udpfs_smap/src, iop/udpfs_smap/include]
    headers: *iop_headers
    cflags: [-mno-check-zero-division]
    imports_lst: iop/udpfs_smap/src/imports.lst
    exports_tab: iop/udpfs_smap/src/exports.tab

  - name: udpfs_ministack
    type: iop
    sources: [iop/udpfs_ministack/src/main.c, iop/udpfs_ministack/src/ministack_arp.c, iop/udpfs_ministack/src/ministack_eth.c, iop/udpfs_ministack/src/ministack_ip.c, iop/udpfs_ministack/src/ministack_udp.c, iop/udpfs_ministack/src/udptty.c]
    include_dirs: [iop/udpfs_ministack/src, iop/udpfs_ministack/include, iop/udpfs_smap/include]
    headers: *iop_headers
    cflags: [-mno-check-zero-division]
    imports_lst: iop/udpfs_ministack/src/imports.lst
    exports_tab: iop/udpfs_ministack/src/exports.tab

  - name: udpfs_ioman
    type: iop
    sources: [iop/udpfs_ioman/src/main.c, iop/udpfs_ioman/src/udprdma.c, iop/udpfs_ioman/src/udpfs_core.c, iop/udpfs_ioman/src/udpfs_ioman.c]
    include_dirs: [iop/udpfs_ioman/src, iop/udpfs_ioman/include, iop/udpfs_smap/include, iop/udpfs_ministack/include]
    headers: *iop_headers
    defines: [FEATURE_UDPFS_IOMAN, UDPRDMA_MAX_SOCKETS=1]
    cflags: [-mno-check-zero-division]
    imports_lst: iop/udpfs_ioman/src/imports.lst
    exports_tab: iop/udpfs_ioman/src/exports.tab

  # Coherent MMCEMAN pinned to the same post-sio2man-fix generation
  # used by RiptOPL. The SDK prebuilt is older and fails sustained transfers
  # against current sio2man on real hardware. Keep SDK stock MMCEDRV below.
  - name: mmceman
    type: iop
    sources:
      - iop/mmceman/src/ioplib.c
      - iop/mmceman/src/sio2man_hook.c
      - iop/mmceman/src/mmce_sio2.c
      - iop/mmceman/src/mmce_cmds.c
      - iop/mmceman/src/mmce_fs.c
      - iop/mmceman/src/mmceman.c
    include_dirs: [iop/mmceman/include]
    headers: *iop_headers
    defines: [IOMANX_OLD_NAME_COMPATIBILITY=0, IOMANX_OLD_NAME_ADDDELDRV=0]
    imports_lst: iop/mmceman/src/imports.lst

  - name: ssb_mmce_stream
    type: iop
    sources: [iop/mmce_stream/src/main.c]
    include_dirs: [iop/mmce_stream/src]
    headers: *iop_headers
    defines: [IOMANX_OLD_NAME_COMPATIBILITY=0, IOMANX_OLD_NAME_ADDDELDRV=0]
    imports_lst: iop/mmce_stream/src/imports.lst

  - name: ssb_usb_quiesce
    type: iop
    sources: [iop/usb_quiesce/src/main.c]
    include_dirs: [iop/usb_quiesce/src]
    headers: *iop_headers
    imports_lst: iop/usb_quiesce/src/imports.lst

  - name: ssb_audio
    type: iop
    sources: [iop/audio_server/src/main.c]
    include_dirs: [iop/audio_server/src]
    headers: *iop_headers
    imports_lst: iop/audio_server/src/imports.lst

  - name: ssb_platform
    type: ee_lib
    sources:
      - src/platform/*.c
      - src/platform/*.S
      - src/memory/*.c
      - src/memory/*.S
      - src/storage/*.c
      - src/input/*.c
      - src/audio/*.c
      - src/renderer/*.c
      - src/ultra/*.c
    include_dirs:
      - include
      - src/renderer
    headers:
      - gskit
      - dmakit
      - pad
      - mtap
      - mc
      - filexio
      - usbd
      - patches
      - debug
    defines:
      - PLATFORM_PS2
      - REGION_US
      - F3DEX_GBI_2
      - _MIPS_SZLONG=32
    cflags:
      # Game headers (PR/*.h etc.) come last so newlib's own headers win.
      - -idirafter
      - ../../include
      - -idirafter
      - ../../src
      - -fno-strict-aliasing
      - -Wall

  # The decompiled game itself, shared with the N64 build. N64-only pieces
  # are left out here (replaced by ssb_platform): libultra io/os and IDO
  # runtime helpers and sys/framebuffer.c (the framebuffers live in the PS2
  # scene-arena glue). ps2/src/game holds the few PS2-side definitions that
  # the N64 build gets from assembly or excluded debug overlays.
  - name: ssb_game
    type: ee_lib
    sources:
      - ../src/ef/*.c
      - ../src/ft/*.c
      - ../src/ft/ftchar/ftboss/*.c
      - ../src/ft/ftchar/ftcaptain/*.c
      - ../src/ft/ftchar/ftdonkey/*.c
      - ../src/ft/ftchar/ftfox/*.c
      - ../src/ft/ftchar/ftgdonkey/*.c
      - ../src/ft/ftchar/ftkirby/*.c
      - ../src/ft/ftchar/ftlink/*.c
      - ../src/ft/ftchar/ftluigi/*.c
      - ../src/ft/ftchar/ftmario/*.c
      - ../src/ft/ftchar/ftmmario/*.c
      - ../src/ft/ftchar/ftncaptain/*.c
      - ../src/ft/ftchar/ftndonkey/*.c
      - ../src/ft/ftchar/ftness/*.c
      - ../src/ft/ftchar/ftnfox/*.c
      - ../src/ft/ftchar/ftnkirby/*.c
      - ../src/ft/ftchar/ftnlink/*.c
      - ../src/ft/ftchar/ftnluigi/*.c
      - ../src/ft/ftchar/ftnmario/*.c
      - ../src/ft/ftchar/ftnness/*.c
      - ../src/ft/ftchar/ftnpikachu/*.c
      - ../src/ft/ftchar/ftnpurin/*.c
      - ../src/ft/ftchar/ftnsamus/*.c
      - ../src/ft/ftchar/ftnyoshi/*.c
      - ../src/ft/ftchar/ftpikachu/*.c
      - ../src/ft/ftchar/ftpurin/*.c
      - ../src/ft/ftchar/ftsamus/*.c
      - ../src/ft/ftchar/ftyoshi/*.c
      - ../src/ft/ftcommon/*.c
      - ../src/gm/*.c
      - ../src/gr/*.c
      - ../src/gr/grbonus/*.c
      - ../src/gr/grcommon/*.c
      - ../src/if/*.c
      - ../src/it/*.c
      - ../src/it/itcommon/*.c
      - ../src/it/itfighter/*.c
      - ../src/it/itground/*.c
      - ../src/it/itmonster/*.c
      - ../src/lb/*.c
      - ../src/mn/mn1pmode/*.c
      - ../src/mn/mncommon/*.c
      - ../src/mn/mndata/*.c
      - ../src/mn/mnmaps/*.c
      - ../src/mn/mnoption/*.c
      - ../src/mn/mnplayers/*.c
      - ../src/mn/mnvsmode/*.c
      - ../src/mp/*.c
      - ../src/mv/*.c
      - ../src/mv/mvending/*.c
      - ../src/mv/mvopening/*.c
      - ../src/sc/*.c
      - ../src/sc/sc1pmode/*.c
      - ../src/sc/sccommon/*.c
      - ../src/sc/scsubsys/*.c
      - ../src/wp/*.c
      - ../src/wp/wpboss/*.c
      - ../src/wp/wpfox/*.c
      - ../src/wp/wpkirby/*.c
      - ../src/wp/wplink/*.c
      - ../src/wp/wpmario/*.c
      - ../src/wp/wpness/*.c
      - ../src/wp/wppikachu/*.c
      - ../src/wp/wpsamus/*.c
      - ../src/wp/wpyoshi/*.c
      - src/game/*.c
      - ../src/sys/audio.c
      - ../src/sys/controller.c
      - ../src/sys/debug.c
      - ../src/sys/dma.c
      - ../src/sys/interp.c
      - ../src/sys/main.c
      - ../src/sys/maindevice.c
      - ../src/sys/malloc.c
      - ../src/sys/matrix.c
      - ../src/sys/objanim.c
      - ../src/sys/objdisplay.c
      - ../src/sys/objhelper.c
      - ../src/sys/objman.c
      - ../src/sys/objscript.c
      - ../src/sys/rdp.c
      - ../src/sys/scheduler.c
      - ../src/sys/sintable.c
      - ../src/sys/taskman.c
      - ../src/sys/unref.c
      - ../src/sys/utils.c
      - ../src/sys/vector.c
      - ../src/sys/video.c
      - ../src/sys/zbuffer.c
      - ../src/libultra/gu/*.c
      - ../src/libultra/sp/*.c
      - ../src/libultra/audio/*.c
      - ../src/libultra/n_audio/*.c
      - ../src/libultra/vimodes/*.c
      - ../src/libultra/libc/ldiv.c
      - ../src/libultra/libc/xprintf.c
      - ../src/libultra/libc/xldtob.c
      - ../src/libultra/libc/xlitob.c
    include_dirs:
      - ../include
      - ../src
      - ../build/us/src
      - include
    defines:
      - PLATFORM_PS2
      - REGION_US
      - F3DEX_GBI_2
      - _MIPS_SZLONG=32
      - NDEBUG
      - N_MICRO
      - _FINALROM
      - NON_MATCHING
      - AVOID_UB
    cflags:
      - -std=gnu99
      - -fpermissive
      - -fno-strict-aliasing
      - -fwrapv
      # The EE FPU is single precision; keep literal constants in f32 so
      # N64-era expressions like x * 0.5 do not fall back to soft doubles.
      - -fsingle-precision-constant
      - -Wno-unused-variable
      - -Wno-unused-but-set-variable
      - -Wno-unused-function
      - -Wno-missing-braces
      - -Wno-unknown-pragmas
      - -Wno-multichar

  - name: ssb64
    type: ee
    sources:
      - src/boot/main.c
    include_dirs:
      - include
    linkfile: ps2_linkfile.ld
    ldflags:
      # N64 linker constants: generated ll* relocData symbols + PS2 values.
      - ../../symbols/reloc_data_symbols.us.txt
      - ../ps2_link.x
    libs:
      # game <-> platform reference each other; repeat for the 1-pass linker
      - ssb_game
      - ssb_platform
      - ssb_game
      - ssb_platform
      - gskit
      - dmakit
      - pad
      - mtap
      - mc
      - filexio
      - patches
      - sdr
      - debug
      - m
    embed_irx:
      - ssb_usb_quiesce
      - iomanx
      - filexio
      - sio2man
      - mtapman
      - padman
      - mcman
      - mcserv
      - libsd
      - ssb_audio
      # Common BDM + physical transports.
      - bdm
      - bdmfs_fatfs
      - usbd_mini
      - usbmass_bd_mini
      - dev9:ps2dev9
      - ata_bd:ps2atad
      - mx4sio_bd_mini:mx4sio_bd
      - iLinkman
      - IEEE1394_bd_mini:IEEE1394_bd

      # Network storage. UDPBD is a BDM transport; UDPFS is an iomanX
      # filesystem and therefore uses its own SMAP/ministack chain.
      - smap_udpbd
      - udpfs_smap
      - udpfs_ministack
      - udpfs_ioman

      # APA/PFS HDD.
      - apa:ps2hdd
      - fs:ps2fs
      - secrsif

      # Optical filesystem for cdrom0: asset-pack launches.
      - cdfs:cdvd

      - mmceman
      - mmcedrv
      - ssb_mmce_stream
